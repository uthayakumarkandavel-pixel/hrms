<div class="hrms-shell">
  <header class="hrms-header">
    <hrms-header (toggleSidebar)="toggleSidebar()"></hrms-header>
  </header>

  <mat-sidenav-container class="hrms-container">
    <mat-sidenav
      #sidenav
      class="hrms-sidebar"
      mode="side"
      [opened]="sidebarOpen"
      [class.sidebar-collapsed]="!sidebarOpen"
      [fixedInViewport]="false"
    >
      <hrms-sidebar></hrms-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="hrms-content">
      <main class="hrms-main">
        @if (pageHeader) {
          <header class="page-header">
            <div class="page-title">
              <h1>{{ pageHeader.TITLE }}</h1>
              <p>{{ pageHeader.CAPTION }}</p>
            </div>
          </header>
        }

        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
