<div class="sidebar">
  <nav class="sidebar-nav">
    @for (item of items; track item.link) {
      <a
        mat-button
        class="nav-item"
        [routerLink]="item.link"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.title }}</span>
      </a>
    }
  </nav>
</div>
