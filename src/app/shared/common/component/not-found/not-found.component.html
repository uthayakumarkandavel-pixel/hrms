<div class="not-found-container">
  <mat-card class="not-found-content">
    <div class="error-icon"><mat-icon>search_off</mat-icon></div>
    <span class="eyebrow">{{ text.EYEBROW }}</span>
    <div class="error-code">404</div>
    <h1>{{ text.TITLE }}</h1>
    <p>{{ text.DESCRIPTION }}</p>
    <button mat-flat-button routerLink="/login">
      <mat-icon>home</mat-icon>
      {{ text.BACK_TO_LOGIN }}
    </button>
  </mat-card>
</div>
