<div class="header-content">
  <div class="header-left">
    <button
      mat-icon-button
      class="sidebar-toggle"
      type="button"
      [attr.aria-label]="text.SEARCH"
      (click)="toggleSidebar.emit()"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <div class="header-brand">
      <div class="header-brand-mark">
        <img src="/assets/logo.png" [alt]="app.NAME" />
      </div>
      <div class="header-brand-copy">
        <strong>{{ app.NAME }}</strong>
        <span>{{ app.TAGLINE }}</span>
      </div>
    </div>
  </div>

  <div class="header-actions">
    <button mat-icon-button class="header-action" [attr.aria-label]="text.SEARCH">
      <mat-icon>search</mat-icon>
    </button>

    <button mat-icon-button class="header-action notification" [attr.aria-label]="text.NOTIFICATIONS">
      <mat-icon>notifications_none</mat-icon>
      <span class="notification-badge">3</span>
    </button>

    <div class="profile-divider"></div>

    <button mat-button class="profile-button" [matMenuTriggerFor]="userMenu">
      <span class="avatar">HR</span>
      <span class="profile-copy">
        <strong>{{ text.MY_ACCOUNT }}</strong>
        <small>{{ text.ACCOUNT_SETTINGS }}</small>
      </span>
      <mat-icon>keyboard_arrow_down</mat-icon>
    </button>
  </div>
</div>

<mat-menu #userMenu="matMenu">
  <button mat-menu-item>
    <mat-icon>person_outline</mat-icon>
    <span>{{ text.PROFILE }}</span>
  </button>
  <button mat-menu-item>
    <mat-icon>settings</mat-icon>
    <span>{{ text.SETTINGS }}</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>{{ text.LOGOUT }}</span>
  </button>
</mat-menu>
