<div class="dialog">
  <div class="dialog-header">
    <div>
      <h2>{{ text.TITLE }}</h2>
      <p>{{ text.CAPTION }}</p>
    </div>
    <button mat-icon-button type="button" (click)="close()" [attr.aria-label]="text.CLOSE">
      <mat-icon> close </mat-icon>
    </button>
  </div>

  <div class="options">
    <button class="option" type="button" (click)="select('leave')">
      <div class="option-icon common-icon leave">
        <mat-icon> event_available </mat-icon>
      </div>
      <div class="option-content">
        <strong>{{ text.REQUEST_LEAVE }}</strong>
        <span>{{ text.REQUEST_LEAVE_DESCRIPTION }}</span>
      </div>
      <mat-icon class="arrow"> chevron_right </mat-icon>
    </button>

    <button class="option" type="button" (click)="select('permission')">
      <div class="option-icon common-icon permission">
        <mat-icon> schedule </mat-icon>
      </div>
      <div class="option-content">
        <strong>{{ text.REQUEST_PERMISSION }}</strong>
        <span>{{ text.REQUEST_PERMISSION_DESCRIPTION }}</span>
      </div>
      <mat-icon class="arrow"> chevron_right </mat-icon>
    </button>
  </div>
</div>
