<div class="leave-page">
  <div class="balance-grid">
    <app-progress-card
      [title]="leaveManagement.LEAVE_PROGRESS"
      [progressbar]="{ usedValue: usedLeaveDays, totalValue: limits().annualLeaveDays }"
      [theme]="'#2563eb'"
      [icon]="'event_available'"
    />

    <app-progress-card
      [title]="leaveManagement.PERMISSION_PROGRESS"
      [progressbar]="{
        usedValue: usedPermissionHours,
        totalValue: limits().monthlyPermissionHours,
      }"
      [theme]="'#d97706'"
      [icon]="'schedule'"
    />
  </div>

  <div class="quick-actions">
    <button class="quick-action" type="button" (click)="openLeaveDialog()">
      <div class="quick-action-icon common-icon leave-icon">
        <mat-icon> event_note </mat-icon>
      </div>
      <div class="quick-action-content">
        <strong>{{ leave.REQUEST_LEAVE }}</strong>
        <span>{{ leave.REQUEST_LEAVE_DESCRIPTION }}</span>
      </div>
      <mat-icon class="arrow"> chevron_right </mat-icon>
    </button>

    <button class="quick-action" type="button" (click)="openPermissionDialog()">
      <div class="quick-action-icon common-icon permission-icon">
        <mat-icon> schedule </mat-icon>
      </div>
      <div class="quick-action-content">
        <strong>{{ leave.REQUEST_PERMISSION }}</strong>
        <span>{{ leave.REQUEST_PERMISSION_DESCRIPTION }}</span>
      </div>
      <mat-icon class="arrow"> chevron_right </mat-icon>
    </button>
  </div>
</div>
