<div class="tab-content">
  <section class="badge-grid">
    @for (badge of badges; track badge.name) {
      <mat-card class="badge-card" [class.locked]="badge.status === 'Locked'">
        <div class="badge-card-top">
          <div class="badge-icon">
            <mat-icon>{{ badge.icon }}</mat-icon>
          </div>
          <mat-chip [class.earned-chip]="badge.status === 'Earned'">
            {{ badge.status }}
          </mat-chip>
        </div>

        <h3>{{ badge.name }}</h3>
        <p>{{ badge.description }}</p>
        <span class="badge-duration">{{ badge.duration }}</span>

        @if (badge.status === 'In Progress') {
          <div class="progress-section">
            <div class="progress-label">
              <span>{{ badge.current }} / {{ badge.target }} months</span>
              <strong>{{ badge.progress }}%</strong>
            </div>
            <mat-progress-bar mode="determinate" [value]="badge.progress"></mat-progress-bar>
          </div>
        }
      </mat-card>
    }
  </section>
</div>
